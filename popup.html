<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>提示</title>
<style>
  html,body{height:100%;margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
  body{
    display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
    background:rgba(0,0,0,.45);
    font:17px/1.75 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#1c1b1f;
    animation:fadeIn .18s ease-out;
  }
  .box{
    max-width:82%;padding:26px 22px;border-radius:20px;background:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.18);text-align:center;
    transform-origin:center;animation:pop .26s cubic-bezier(.2,1.3,.5,1);
    transition:opacity .22s ease,transform .22s ease;
  }
  .box.out{opacity:0;transform:scale(.96)}
  .hint{
    position:fixed;left:0;right:0;bottom:28px;text-align:center;
    font-size:12px;color:rgba(255,255,255,.75);opacity:0;transition:opacity .3s;
  }
  .hint.show{opacity:1}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
<div class="box" id="box">晚上好，今晚的月亮很圆。</div>
<div class="hint" id="hint">点两下返回，或稍等自动消失</div>
<script>
  var p = new URLSearchParams(location.search);
  var t = p.get('t');
  if (t) { try { document.getElementById('box').textContent = decodeURIComponent(t); } catch (e) {} }
  var ms = parseInt(p.get('d') || '3000', 10);
  if (!isFinite(ms) || ms < 0) ms = 3000;
  var box = document.getElementById('box');
  var hint = document.getElementById('hint');
  if (ms > 0) {
    setTimeout(function () {
      box.classList.add('out');
      hint.classList.add('show');
      setTimeout(function () { try { history.length > 1 ? history.back() : window.close(); } catch (e) {} }, 320);
    }, ms);
  }
  box.addEventListener('click', function () {
    box.classList.add('out');
    hint.classList.add('show');
    setTimeout(function () { try { history.length > 1 ? history.back() : window.close(); } catch (e) {} }, 200);
  });
</script>
</html>
